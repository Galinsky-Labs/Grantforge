# Render Blueprint for GrantForge: one Docker web service. The database is Neon Postgres.
#
# Values marked "sync: false" are secrets or personal settings. Render asks for them when the
# Blueprint is created and never reads them from this file. README.md ("Deploy on Render with Neon")
# says where each one comes from.
services:
  - type: web
    name: grantforge
    runtime: docker
    # The live service runs on Free. Free works, with limits that GrantForge handles (see README, "Free plan"):
    # the instance sleeps after 15 minutes without a visitor (the worker keeps it awake while a job runs and
    # resumes an interrupted run when it wakes), and outbound SMTP is blocked (use GF_EMAIL_BACKEND=resend).
    # Starter removes both limits; changing the plan is the owner's decision because it is paid.
    plan: free
    region: ohio            # same AWS region as the Neon project (us-east-2)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ----- database (Neon) -----
      - key: GF_DATABASE_URL          # Neon pooled connection string (host contains "-pooler")
        sync: false
      - key: GF_DATABASE_URL_DIRECT   # Neon direct connection string (used for schema migrations)
        sync: false
      # ----- model -----
      - key: ANTHROPIC_API_KEY
        sync: false
      # ----- access -----
      - key: GF_UI_PASSWORD           # required to sign in and to Authorize
        sync: false
      - key: GF_APP_SECRET            # signs review links; generated once by Render
        generateValue: true
      - key: GF_TRUST_PROXY           # Render's proxy supplies the visitor's address
        value: "true"
      - key: GF_HOSTING_PLAN          # "free" explains the Free plan's limits on the Setup status page
        value: free
      # ----- email -----
      # On Free, SMTP is blocked: set GF_EMAIL_BACKEND=resend and RESEND_API_KEY (and GF_EMAIL_FROM on a domain
      # verified in Resend). On Starter, smtp with the GF_SMTP_* values below works.
      - key: GF_EMAIL_BACKEND
        value: smtp
      - key: RESEND_API_KEY           # from resend.com -> API Keys; only used when GF_EMAIL_BACKEND=resend
        sync: false
      - key: GF_NOTIFY_TO             # where review links and reminders are sent
        sync: false
      - key: GF_EMAIL_FROM            # the From address; usually the same as GF_SMTP_USER
        sync: false
      - key: GF_SMTP_HOST
        value: smtp.gmail.com
      - key: GF_SMTP_PORT
        value: "587"
      - key: GF_SMTP_USER
        sync: false
      - key: GF_SMTP_PASSWORD         # for Gmail: an App Password, not the account password
        sync: false
      # ----- limits that suit a hosted instance -----
      - key: GF_MAX_UPLOAD_MB         # uploads are stored in the database, so keep each file modest
        value: "25"
      - key: GF_MONTHLY_BUDGET_USD
        value: "30"
# GF_BASE_URL is not set here: the app uses the address Render assigns (RENDER_EXTERNAL_URL).
# Set GF_BASE_URL only when you put a custom domain in front of the service.
